[project]
name = "faculty-atlas"
version = "0.2.0"
description = "Evidence-backed faculty research and recruitment database"
requires-python = ">=3.11"
dependencies = ["beautifulsoup4>=4.12,<5", "httpx>=0.27,<1", "pydantic>=2.8,<3"]

[project.optional-dependencies]
browser = ["playwright>=1.48,<2"]
publications = ["aiohttp>=3.9,<4"]
semantic = ["fastembed==0.7.4", "numpy>=2,<3"]

[project.scripts]
faculty = "faculty_atlas.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["faculty_atlas"]

[tool.hatch.build]
include = ["faculty_atlas/**", "third_party/phd-scout/LICENSE"]
